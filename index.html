<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Planet Explorer VR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js" } }
</script>
<style>
/* Layout: 3D view on top, a small control panel below. The panel never covers the view. */
:root { --bg:#050510; --fg:#e8ecff; --muted:#8a92b8; --accent:#7cf0c8; color-scheme: dark; }
html, body { height:100%; margin:0; }
body { background:var(--bg); color:var(--fg);
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px; box-sizing:border-box; display:flex; flex-direction:column; gap:12px; }
#view { position:relative; flex:1 1 auto; min-height:320px; border-radius:14px; overflow:hidden; background:#000; }
#view canvas { display:block; width:100%; height:100%; touch-action:none; }
.panel { display:flex; flex-direction:column; gap:10px; align-items:center; }
.row { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
.btn { min-height:48px; padding:0 22px; border-radius:12px; border:0; font:600 16px system-ui,sans-serif;
  background:var(--accent); color:#04110d; cursor:pointer; }
.btn[hidden] { display:none; }
.btn:focus-visible { outline:2px solid var(--fg); outline-offset:2px; }
#status { margin:0; color:var(--muted); text-align:center; text-wrap:balance; max-width:560px; }
.start { position:absolute; inset:0; display:grid; place-items:center; padding:16px; box-sizing:border-box;
  background:rgba(5,5,16,.7); }
.start[hidden] { display:none; }
.start .card { max-width:380px; background:#121428; border:1px solid rgba(255,255,255,.12); border-radius:16px;
  padding:22px; text-align:center; }
.start h2 { margin:0 0 8px; font-size:22px; }
.start p { margin:0 0 16px; color:var(--muted); text-wrap:pretty; }
.start .row { display:flex; flex-direction:column; gap:10px; }
.btn.ghost { background:rgba(255,255,255,.08); color:var(--fg); }
</style>
</head>
<body>
<div id="view">
  <div id="start" class="start" hidden>
